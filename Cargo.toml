[workspace]
members = ["crates/core", "crates/runtime", "crates/cli", "crates/studio"]
default-members = ["crates/cli", "crates/studio"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
agge-core = { path = "crates/core", version = "0.1.0" }
agge-runtime = { path = "crates/runtime", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
