[package]
name = "agge-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
vulkan = ["eframe/wgpu", "dep:wgpu"]

[dependencies]
agge-core.workspace = true
agge-runtime.workspace = true
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav", "vorbis"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
wgpu = { version = "25", default-features = false, features = ["vulkan"], optional = true }
